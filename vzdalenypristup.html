  <meta charset="UTF-8">

  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f7f7f7; }
    .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); font-size: 12px; display: none; }
    h1, h2 { text-align: center; margin-bottom: 10px; }
    .form-group { margin-bottom: 8px; }
    label { display: block; font-weight: bold; margin-bottom: 3px; }
    input, select, textarea { width: 100%; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
    table, th, td { border: 1px solid #ddd; }
    th { background-color: #004080; color: white; padding: 6px; text-align: center; }
    td { padding: 4px; text-align: center; }
    tr:nth-child(even) { background-color: #f2f2f2; }
    .failed { color: red; font-weight: bold; }
    .ok { color: green; font-weight: bold; }
    .buttons { margin-top: 10px; text-align: center; }
    button { background-color: #004080; color: white; border: none; padding: 8px 16px; margin: 5px; border-radius: 5px; cursor: pointer; font-size: 12px; }
    button:hover { background-color: #0066cc; }
    input[type="file"] { margin-top: 5px; }
    #loginBox { max-width: 400px; margin: 100px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; }
  </style>
</head>

    <p id="loginMsg" style="color:red; margin-top:5px;"></p>
  </div>

    <h1>Vítkovické železniční opravny</h1>
    <h2>Formulář měření</h2>
    <div class="form-group">
      <label for="project">Název projektu:</label>
      <input type="text" id="project" name="project">
    </div>
    <div class="form-group">
      <label for="vehicle">Číslo vozidla:</label>
      <input type="text" id="vehicle" name="vehicle">
    </div>
    <div class="form-group">
      <label for="operator">Jméno operátora:</label>
      <select id="operator" name="operator">
        <option value="">-- Vyberte operátora --</option>
        <option value="Radek Klepacz">Radek Klepacz</option>
        <option value="Marek Hornak">Marek Hornak</option>
        <option value="Lukas Chamrad">Lukas Chamrad</option>
      </select>
    </div>
    <div class="form-group">
      <label for="remarks">Poznámky:</label>
      <textarea id="remarks" name="remarks" rows="2"></textarea>
    </div>

    <h2>Výsledky měření kol</h2>
    <input type="file" id="csvFile" accept=".csv">
    <table id="resultsTable">
      <thead></thead>
      <tbody></tbody>
    </table>
    <div class="buttons">
      <button onclick="downloadPDF()">Uložit jako PDF</button>
    </div>
  </div>

  <script>
    const PASSWORD = '1234';
    function checkPassword() {
      const pwd = document.getElementById('password').value;
      if(pwd === PASSWORD) {
        document.getElementById('loginBox').style.display = 'none';
        document.querySelector('.container').style.display = 'block';
      } else {
        document.getElementById('loginMsg').innerText = 'Špatné heslo.';
      }
    }

    const headerTranslations = {
      'axle number':'Číslo nápravy',
      'axle id':'ID nápravy',
      'average of left wheel diameter [mm]':'Průměr levého kola [mm]',
      'average of right wheel diameter [mm]':'Průměr pravého kola [mm]',
      'difference [mm]':'Rozdíl [mm]',
      'passable':'Splňuje'
    };

    document.getElementById('csvFile').addEventListener('change', function(e){
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = function(e){
        let text = e.target.result;
        text = text.replace(/"/g,''); // odstranění uvozovek
        const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
        let tbody = document.querySelector('#resultsTable tbody');
        let thead = document.querySelector('#resultsTable thead');
        tbody.innerHTML = '';
        thead.innerHTML = '';

        // formulář
        lines.forEach(line => {
          const cols = line.split(';');
          if(line.startsWith('Project name')) document.getElementById('project').value = cols[1]||'';
          if(line.startsWith('Vehicle Number')) document.getElementById('vehicle').value = cols[1]||'';
          if(line.startsWith('Operator name')) document.getElementById('operator').value = cols[1]||'';
          if(line.startsWith('Remarks')) document.getElementById('remarks').value = cols[1]||'';
        });

        // hlavička tabulky
        const headerLineIndex = lines.findIndex(l => l.toLowerCase().startsWith('axle number'));
        if(headerLineIndex !== -1){
          const headers = lines[headerLineIndex].split(';').map(h=>headerTranslations[h.trim().toLowerCase()]||h);
          let tr = document.createElement('tr');
          headers.forEach(h=>{ let th=document.createElement('th'); th.innerText=h; tr.appendChild(th); });
          thead.appendChild(tr);

          // data
          for(let i=headerLineIndex+1;i<lines.length;i++){
            const row = lines[i].split(';');
            if(row.length<headers.length) continue;
            let tr = document.createElement('tr');
            row.forEach((cell,j)=>{
              let td = document.createElement('td');
              td.innerText = cell;
              if(headers[j]==='Splňuje') td.className = (cell.toLowerCase()==='failed')?'failed':'ok';
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          }
        }
      };
      reader.readAsText(file);
    });

    function downloadPDF(){
      const element = document.getElementById('report');
      html2pdf().set({margin:0.5, filename:'vysledky.pdf', html2canvas:{scale:2}}).from(element).save();
    }
  </script>
